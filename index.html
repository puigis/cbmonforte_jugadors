<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6b3a">
<title>CB Monforte</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1c1c1a;--muted:#6b6a64;--felt:#1f6b3a;--felt2:#174f2b;--up:#15803d;--down:#b91c1c;--line:#e3dfd4;--chip:#eef3ee;--mon:#fdf6e3;--pend:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121412;--card:#1c1f1c;--ink:#ecebe6;--muted:#9a998f;--line:#2e322e;--up:#4ade80;--down:#f87171;--chip:#243024;--mon:#2a2716;--pend:#fbbf24}}
:root[data-theme="dark"]{--bg:#121412;--card:#1c1f1c;--ink:#ecebe6;--muted:#9a998f;--line:#2e322e;--up:#4ade80;--down:#f87171;--chip:#243024;--mon:#2a2716;--pend:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:linear-gradient(160deg,var(--felt),var(--felt2));color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header p{margin:2px 0 8px;opacity:.8;font-size:13px}
nav{display:flex;max-width:760px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;padding:10px 4px;font-size:15px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{opacity:1;border-color:#fff;font-weight:600}
.hwrap{max-width:760px;margin:0 auto}
main{padding:16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--chip);border-radius:10px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi small{display:block;font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer}
tr.mon td{background:var(--mon)}
.scroll{overflow-x:auto}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}.eq{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--felt);color:#fff;font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:8px 4px;border-radius:8px;font-size:13px;cursor:pointer;line-height:1.2}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button small{display:block;color:var(--muted);font-size:11px;font-weight:400}
input[type=search]{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);flex:1;min-width:0}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-right:6px;vertical-align:1px}
.L{background:#dcfce7;color:#166534}.F{background:#e0e7ff;color:#3730a3}
.PD{background:#fef3c7;color:#92400e}
.G{color:var(--up);font-weight:700}.P{color:var(--down);font-weight:700}.E{color:var(--muted);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .L{background:#14532d;color:#bbf7d0}:root:not([data-theme="light"]) .F{background:#312e81;color:#c7d2fe}:root:not([data-theme="light"]) .PD{background:#451a03;color:#fde68a}}
.match{border-bottom:1px solid var(--line);padding:10px 0}
.match:last-child{border:0}
.back{background:none;border:0;color:var(--felt);font-size:15px;padding:0 0 10px;cursor:pointer}
@media (prefers-color-scheme:dark){.back{color:#86efac}}
.link{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.more{width:100%;margin-top:8px;background:var(--chip);color:var(--ink);border:0;border-radius:9px;padding:10px;font-size:14px;cursor:pointer}
.note{background:var(--mon);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
svg text{fill:var(--muted);font-size:10px}
td small{font-size:12px;font-weight:400}
.t2 th,.t2 td{padding:7px 3px;font-size:13px}
@media (max-width:480px){.w{display:none}}
</style>
</head>
<body>
<header><div class="hwrap"><h1>🎱 CB Monforte</h1><p id="sub">Billar · temporada</p></div>
<nav id="nav"><button data-t="equips">Equips</button><button data-t="ranking">Rànquing</button><button data-t="jugadors">Jugadors</button></nav></header>
<main id="app"><div class="card"><p class="muted">Carregant dades…</p></div></main>
<script>
const MODS=['Tres bandes','Banda','Lliure','Quadre 47/2','Quadre 71/2'];
let RK=null,EQ=null,cache={},err=false;
let st={tab:'equips',equip:0,mod:'Tres bandes',rk:'personal',nomesMon:true,q:'',player:null,pmod:null,mostra:20};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f3=x=>(x==null||isNaN(x))?'—':(+x).toFixed(3);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const fdc=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const av=(c,e)=>e?c/e:null;

function delta(a,b,dec=3,inv=false){ // a - b
  if(a==null||b==null)return'<span class="eq">—</span>';
  let d=a-b; if(inv)d=-d;
  const t=dec?Math.abs(d).toFixed(dec):Math.abs(d);
  if(dec?Math.abs(d)<0.0005:d===0)return`<span class="eq">=</span>`;
  return d>0?`<span class="up">▲ ${t}</span>`:`<span class="down">▼ ${t}</span>`;
}
function res(r){return r?`<span class="${r}">${r}</span>`:''}

/* ---------- navegació ---------- */
function go(t){st.tab=t;st.player=null;push();render()}
function openP(id,mod){st.player=id;st.pmod=mod||null;st.mostra=20;push();render()}
function push(){history.pushState({...st},'')}
window.onpopstate=e=>{if(e.state){st=e.state;render()}};
document.getElementById('nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};

function render(){
  const a=document.getElementById('app');
  if(err){a.innerHTML=`<div class="card"><h2>No es poden carregar les dades</h2><p class="muted">Torna-ho a provar d'aquí a una estona.</p></div>`;return}
  if(!RK||!EQ)return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',!st.player&&b.dataset.t===st.tab));
  if(st.player){fitxa(st.player).then(h=>{a.innerHTML=h;window.scrollTo(0,0)});return}
  a.innerHTML=st.tab==='equips'?equips():st.tab==='ranking'?ranking():jugadors();
}

/* ---------- equips ---------- */
function statsEq(e,pid){
  let car=0,ent=0,g=0,em=0,p=0,pj=0,loc=0;
  e.matches.forEach(m=>m.results.filter(r=>r.pid===pid).forEach(r=>{pj++;car+=+r.car||0;ent+=+r.ent||0;if(m.venue==='L')loc++;if(r.res==='G')g++;else if(r.res==='E')em++;else if(r.res==='P')p++}));
  return{pj,loc,car,ent,g,e:em,p,avg:av(car,ent)};
}
function equips(){
  const E=EQ.equips; const e=E[st.equip]||E[0];
  if(!e)return'<div class="card"><p class="muted">No hi ha equips aquesta temporada.</p></div>';
  const lt=x=>(x.equip.match(/"(.+)"/)||[,'·'])[1];
  let car=0,ent=0,pmL=0,pmR=0;e.matches.forEach(m=>{m.results.forEach(r=>{car+=+r.car||0;ent+=+r.ent||0});if(m.punts_match){pmL+=m.punts_match[0]||0;pmR+=m.punts_match[1]||0}});
  const rows=e.players.map(p=>({p,s:statsEq(e,p.id)})).sort((a,b)=>(b.s.avg??-1)-(a.s.avg??-1));
  const cal=(e.calendar||[]).slice().sort((a,b)=>(+a.jornada)-(+b.jornada));
  return`<div class="chips">${E.map((x,i)=>`<button class="chip${i===st.equip?' on':''}" onclick="st.equip=${i};push();render()">Equip ${esc(lt(x))}</button>`).join('')}</div>
  <div class="card"><h2>${esc(e.equip)}</h2><p class="muted" style="margin-top:-4px">${esc(e.competicio)}</p>
   <div class="kpis"><div class="kpi"><b>${e.matches.length}</b><span>Jugats</span></div><div class="kpi"><b>${pmL}–${pmR}</b><span>Punts de match</span></div><div class="kpi"><b>${f3(av(car,ent))}</b><span>Promig equip</span></div></div></div>
  <div class="card"><h3>Jugadors</h3><div class="scroll"><table class="t2">
   <tr><th class="l">Jugador</th><th>PJ</th><th>Inicial</th><th>Lliga</th><th>Evolució</th></tr>
   ${rows.map(({p,s})=>`<tr class="click" onclick="openP('${p.id}','${esc(e.modalitat)}')"><td class="l">${esc(p.name)}</td><td>${s.pj}</td><td>${f3(p.initial===''?null:+p.initial)}</td><td><b>${f3(s.avg)}</b></td><td>${delta(s.avg,p.initial===''?null:+p.initial)}</td></tr>`).join('')}
  </table></div><p class="muted">Inicial: rànquing del 27/07/2026. Toca un jugador per veure'n la fitxa.</p></div>
  <div class="card"><h3>Partits</h3>${e.matches.length?e.matches.slice().reverse().map(m=>`<div class="match"><span class="badge ${m.venue}">${m.venue==='L'?'CASA':'FORA'}</span><b>${esc(m.rival)}</b> ${m.punts_match?`<b style="float:right">${m.punts_match[0]} – ${m.punts_match[1]}</b>`:''}<br><span class="muted">Jornada ${esc(m.jornada)} · ${fd(m.date)}</span>
   <div style="margin-top:6px">${m.results.map(r=>{const p=e.players.find(x=>x.id===r.pid);return`<div class="muted"><span class="link" onclick="openP('${r.pid}','${esc(r.mod||e.modalitat)}')">${esc(p?p.name:r.pid)}</span> ${r.car}/${r.ent} = ${f3(av(r.car,r.ent))} ${res(r.res)}${r.rival?` · vs ${esc(r.rival)} (${r.car_rival} car.)`:''}</div>`}).join('')}</div></div>`).join(''):'<p class="muted">Encara no s\'ha jugat cap partit.</p>'}</div>
  <div class="card"><h3>Calendari</h3>${cal.map(c=>`<div class="match"><span class="badge ${c.venue}">${c.venue==='L'?'CASA':'FORA'}</span>${esc(c.rival)}<br><span class="muted">Jornada ${esc(c.jornada)} · ${fd(c.date)}${c.played?' · Jugat':''}</span></div>`).join('')}</div>
  ${peu()}`;
}

/* ---------- rànquing ---------- */
function ranking(){
  const M=RK.modalitats; const mods=MODS.filter(m=>M[m]); if(!M[st.mod])st.mod=mods[0];
  const b=M[st.mod]; const llista=b[st.rk]||[];
  const ini={};(b.inici||[]).forEach(r=>ini[r.id]=r);
  const q=st.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const rows=llista.filter(r=>(!st.nomesMon||r.mon)&&(!q||r.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)));
  const pers=st.rk==='personal', inici=st.rk==='inici';
  const exp={inici:`Rànquing amb el qual tothom va començar la temporada (${fd(RK.data_inici)}).`,
   federatiu:`Darrer rànquing publicat per la Federació (${fd(RK.data_federatiu)}). S'actualitza cada mes.`,
   personal:`Calculat amb les darreres ${RK.n_partides[st.mod]} partides de cada jugador, incloses les que la Federació encara no ha comptat. Mateix càlcul i ordre que la Federació: caramboles ÷ entrades, i els jugadors amb menys de ${RK.n_partides[st.mod]} partides (provisionals) al final.`}[st.rk];
  return`<div class="chips">${mods.map(m=>`<button class="chip${m===st.mod?' on':''}" onclick="st.mod='${m}';push();render()">${m}</button>`).join('')}</div>
  <div class="seg">${[['inici','Inici temporada',fdc(RK.data_inici)],['federatiu','Federatiu',fdc(RK.data_federatiu)],['personal','Personal','actualitzat']].map(([k,t,s])=>`<button class="${st.rk===k?'on':''}" onclick="st.rk='${k}';push();render()">${t}<small>${s}</small></button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="Cerca un jugador" value="${esc(st.q)}" oninput="st.q=this.value;const p=this.selectionStart;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(p,p)">
   <label class="tog"><input type="checkbox" ${st.nomesMon?'checked':''} onchange="st.nomesMon=this.checked;render()">Només Monforte</label></div>
  <div class="card"><p class="muted" style="margin-top:0">${exp}${inici?'':' Les fletxes comparen amb el rànquing d\'inici de temporada.'}</p><div class="scroll"><table class="t2">
   <tr><th>#</th><th class="l">Jugador</th><th>Mitjana${inici?'':'<br><small>vs inici</small>'}</th><th class="w">C / E</th><th>${pers?'Part.':'P / PT'}</th></tr>
   ${rows.map(r=>{const i0=ini[r.id];return`<tr class="click${r.mon&&!st.nomesMon?' mon':''}" onclick="openP('${r.id}','${st.mod}')">
    <td>${r.pos??''}${!inici&&i0&&r.pos?`<br><small>${delta(r.pos,i0.pos,0,true).replace('▲','↑').replace('▼','↓')}</small>`:''}</td><td class="l">${esc(r.nom)}${r.def==='No'?' <span class="badge PD" style="background:var(--chip);color:var(--muted)">PROV.</span>':''}${!st.nomesMon&&r.club?`<br><span class="muted">${esc(r.club)}</span>`:''}</td>
    <td><b>${f3(r.mj)}</b>${inici?'':`<br><small>${delta(r.mj,i0?.mj)}</small>`}</td>
    <td class="w">${r.c??'—'} / ${r.e??'—'}</td><td>${pers?`${r.n}${r.pend?` <span class="badge PD">+${r.pend}</span>`:''}`:`${r.p??'—'} / ${r.pt??'—'}`}</td></tr>`}).join('')||`<tr><td colspan="5" class="muted l">Cap jugador${st.nomesMon?' del Monforte':''} en aquest rànquing.</td></tr>`}
  </table></div><p class="muted">${pers?`<span class="badge PD">+n</span> partides que encara no compten al rànquing federatiu. `:''}PROV.: provisional, encara no té ${RK.n_partides[st.mod]} partides.</p></div>${peu()}`;
}

/* ---------- jugadors del club ---------- */
function jugadors(){
  const vist={};
  MODS.forEach(m=>{const b=RK.modalitats[m];if(!b)return;b.personal.concat(b.federatiu,b.inici).forEach(r=>{if(r.mon&&!vist[r.id])vist[r.id]={...r,mods:[]};if(r.mon&&!vist[r.id].mods.includes(m))vist[r.id].mods.push(m)})});
  const eq={};EQ.equips.forEach(e=>{const l=(e.equip.match(/"(.+)"/)||[,''])[1];e.players.forEach(p=>(eq[p.id]=eq[p.id]||[]).push(l))});
  const ls=Object.values(vist).sort((a,b)=>a.nom.localeCompare(b.nom));
  return`<div class="card"><h2>Jugadors del club (${ls.length})</h2><table>
   ${ls.map(p=>`<tr class="click" onclick="openP('${p.id}')"><td class="l"><b>${esc(p.nom)}</b><br><span class="muted">${p.mods.join(' · ')}</span></td><td>${(eq[p.id]||[]).map(l=>`<span class="badge L">${l}</span>`).join('')}</td></tr>`).join('')}
  </table></div>${peu()}`;
}

/* ---------- fitxa de jugador ---------- */
async function carrega(id){
  if(!cache[id]){const r=await fetch(`dades/app/jugadors/${id}.json?${RK.updated}`);if(!r.ok)throw 0;cache[id]=await r.json()}
  return cache[id];
}
async function fitxa(id){
  let J;try{J=await carrega(id)}catch(e){return`<button class="back" onclick="history.back()">‹ Enrere</button><div class="card"><p class="muted">No hi ha dades d'aquest jugador.</p></div>`}
  const mods=MODS.filter(m=>J.modalitats[m]&&(J.modalitats[m].federatiu||J.modalitats[m].inici||J.modalitats[m].partides.length));
  let mod=st.pmod&&J.modalitats[st.pmod]?st.pmod:mods[0];
  const M=J.modalitats[mod]; if(!M)return`<button class="back" onclick="history.back()">‹ Enrere</button><div class="card"><h2>${esc(J.nom)}</h2><p class="muted">Sense partides registrades.</p></div>`;
  const I=M.inici,F=M.federatiu,P=M.personal;
  const kpi=(t,r)=>`<div class="kpi"><span>${t}</span><b>${f3(r?.mj)}</b><small>${r?.pos?r.pos+'è lloc':'sense lloc'}</small></div>`;
  const tot=M.ultimes.reduce((a,g)=>(a.c+=g.car||0,a.e+=g.ent||0,a),{c:0,e:0});
  const fila=g=>`<tr><td class="l">${g.pendent?'<span class="badge PD">PENDENT</span>':''}${esc(g.riv)}<br><span class="muted">${fd(g.d)}${g.comp?' · '+esc(g.comp):''}${g.fase?' · '+esc(g.fase):''}${g.j?' · J'+esc(g.j):''}</span></td><td>${g.car??'—'}${g.rc!=null?`<span class="muted">-${g.rc}</span>`:''}</td><td>${g.ent??'—'}</td><td class="w">${g.sm??'—'}</td><td>${f3(av(g.car,g.ent))}</td><td>${res(g.res)}</td></tr>`;
  const cap='<tr><th class="l">Rival</th><th>Car</th><th>Ent</th><th class="w">SM</th><th>Prom.</th><th></th></tr>';
  const T=M.temporades;
  const totH=T.reduce((a,t)=>(a.pj+=t.pj,a.G+=t.G,a.E+=t.E,a.P+=t.P,a.c+=t.car,a.e+=t.ent,a.sm=Math.max(a.sm,t.sm),a),{pj:0,G:0,E:0,P:0,c:0,e:0,sm:0});
  return`<button class="back" onclick="history.back()">‹ Enrere</button>
  <div class="card"><h2 style="margin-bottom:2px">${esc(J.nom)}</h2><p class="muted" style="margin:0 0 10px">${esc(J.club||'')}${J.equips.length?' · Equip '+J.equips.join(', '):''}</p>
   ${mods.length>1?`<div class="chips">${mods.map(m=>`<button class="chip${m===mod?' on':''}" onclick="st.pmod='${m}';st.mostra=20;render()">${m}</button>`).join('')}</div>`:`<p class="muted" style="margin-top:0">${mod}</p>`}
   <div class="kpis">${kpi('Inici temporada',I)}${kpi('Federatiu',F)}${kpi('Personal',P)}</div>
   <p class="muted" style="margin:10px 0 0">Respecte a l'inici: mitjana ${delta(P?.mj,I?.mj)} · ${I?.pos&&P?.pos?delta(P.pos,I.pos,0,true).replace('▲','↑').replace('▼','↓')+' llocs':'—'}</p></div>
  <div class="card"><h3>Evolució al rànquing</h3>${grafic(M)}<p class="muted">Línia verda: mitjana de cada rànquing federatiu. Punt taronja: rànquing personal d'avui. Línia discontínua: inici de temporada.</p></div>
  ${M.pendents.length?`<div class="card"><h3>Partides pendents de comptar (${M.pendents.length})</h3><p class="muted" style="margin-top:0">Ja s'han jugat però encara no surten al rànquing federatiu del ${fd(RK.data_federatiu)}. Sí que compten al personal.</p><div class="scroll"><table class="t2">${cap}${M.pendents.map(fila).join('')}</table></div></div>`:''}
  <div class="card"><h3>Les ${M.ultimes.length} partides del promig</h3><p class="muted" style="margin-top:0">Són les que fan la mitjana personal: ${tot.c} caramboles ÷ ${tot.e} entrades = <b>${f3(av(tot.c,tot.e))}</b></p><div class="scroll"><table class="t2">${cap}${M.ultimes.map(fila).join('')}</table></div></div>
  <div class="card"><h3>Historial per temporada</h3><div class="scroll"><table class="t2"><tr><th class="l">Temporada</th><th>PJ</th><th>G-E-P</th><th class="w">Car</th><th class="w">Ent</th><th>Mitjana</th><th>SM</th></tr>
   ${T.map(t=>`<tr><td class="l">${t.t}</td><td>${t.pj}</td><td>${t.G}-${t.E}-${t.P}</td><td class="w">${t.car}</td><td class="w">${t.ent}</td><td><b>${f3(t.mj)}</b></td><td>${t.sm||'—'}</td></tr>`).join('')}
   ${T.length>1?`<tr><td class="l"><b>Total</b></td><td><b>${totH.pj}</b></td><td>${totH.G}-${totH.E}-${totH.P}</td><td class="w">${totH.c}</td><td class="w">${totH.e}</td><td><b>${f3(av(totH.c,totH.e))}</b></td><td>${totH.sm||'—'}</td></tr>`:''}
   ${T.length?'':'<tr><td class="l muted" colspan="7">Sense partides a la base de dades.</td></tr>'}</table></div></div>
  <div class="card"><h3>Totes les partides (${M.partides.length})</h3><div class="scroll"><table class="t2">${cap}${M.partides.slice(0,st.mostra).map(fila).join('')}</table></div>
   ${M.partides.length>st.mostra?`<button class="more" onclick="st.mostra+=40;render()">Veure'n més</button>`:''}</div>
  ${peu()}`;
}
function grafic(M){
  const pts=(M.evolucio||[]).filter(p=>p[1]!=null);
  const ini=M.inici?.mj, per=M.personal?.mj;
  if(!pts.length&&per==null)return'<p class="muted">Sense historial de rànquing.</p>';
  const W=340,H=160,L=38,R=12,T=10,B=22;
  const vals=pts.map(p=>p[1]);if(ini!=null)vals.push(ini);if(per!=null)vals.push(per);
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<0.05){hi+=0.03;lo-=0.03}const pd=(hi-lo)*.1;lo=Math.max(0,lo-pd);hi+=pd;
  const n=pts.length+(per!=null?1:0);
  const x=i=>n<=1?(L+W-R)/2:L+i*(W-L-R)/(n-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const dec=hi>10?1:hi>3?2:3;
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v.toFixed(dec)}</text>`}
  if(ini!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${y(ini)}" y2="${y(ini)}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  if(pts.length>1)g+=`<polyline fill="none" stroke="var(--up)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p[1])).join(' ')}"/>`;
  g+=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="3" fill="var(--up)"><title>${fd(p[0])}: ${f3(p[1])}${p[2]?' · '+p[2]+'è':''}</title></circle>`).join('');
  if(per!=null)g+=`<circle cx="${x(n-1)}" cy="${y(per)}" r="5" fill="var(--pend)"><title>Personal: ${f3(per)}</title></circle>`;
  if(pts.length)g+=`<text x="${L}" y="${H-6}">${fd(pts[0][0]).slice(3)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${per!=null?'avui':fd(pts[pts.length-1][0]).slice(3)}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function peu(){return`<p class="muted">Dades de la Federació Catalana de Billar. Actualitzat: ${new Date(RK.updated).toLocaleString('ca-ES',{dateStyle:'short',timeStyle:'short'})}</p>`}

Promise.all([fetch('dades/app/rankings.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),
             fetch('dades/app/equips.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()})])
 .then(([r,e])=>{RK=r;EQ=e;document.getElementById('sub').textContent=`Billar · temporada ${r.temporada}`;
   history.replaceState({...st},'');render()})
 .catch(()=>{err=true;render()});
